name: Deploy to GitHub Pages

# 公開前ゲート → ビルド → Pages 公開を1つの workflow で直列化する。
# secret-scan または check（lint/型検査/テスト）が落ちたら build は skip され、Pages には何も公開されない

on:
  push:
    branches: [main]

# 最小権限。書き込みが要るのは deploy job のみ（下で job 単位に付与）。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 平文シークレットの混入を全コミット履歴に対して検査する。
  # build はこの job を needs にするため、ここで落ちると公開に進まない。
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 全コミット履歴を走査する
      - name: Install gitleaks (pinned)
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full history
        run: gitleaks detect --no-banner --redact

  # ---------------------------------------------------------------------------
  # lint / 型検査 / 単体テスト。build はこの job も needs にするため、
  # どれかが落ちると公開に進まない。
  # ---------------------------------------------------------------------------
  check:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    name: Build (static export)
    # スキャンと検査の通過が前提。どちらかが fail すると skip され公開されない。
    needs: [secret-scan, check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 共有カードの PNG は手元で焼いてコミットする。SVG だけ直して焼き直しを忘れると
      # カードが黙って古いままになるため、公開前にここで突き合わせて落とす。
      - run: pnpm og:check
      - run: pnpm build
        env:
          PAGES_BASE_PATH: /knit-grader
      # 書き出された HTML そのものを検査する（canonical・og:image・構造化データ・
      # basePath の外へ出る内部リンク・sitemap・計測タグ・表の数字）。落ちたら公開しない。
      - run: pnpm verify:export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
